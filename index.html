<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700&display=swap" rel="stylesheet" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PujoPlan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

    video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .caption {
      position: fixed;
      bottom: 36px;
      left: 0; right: 0;
      text-align: center;
      z-index: 10;
      font-family: 'Noto Sans Bengali', sans-serif;
      line-height: 1.7;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
    }

    .caption .line1 {
      font-size: clamp(1.3rem, 5vw, 2rem);
      font-weight: 700;
      color: #f5c842;
    }

    .caption .line2 {
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 500;
      color: #ffffff;
    }
  </style>
</head>

<body>

  <video id="v" autoplay muted loop playsinline preload="auto">
    <source src="vid_with_music.mp4" type="video/mp4" />
  </video>

  <div class="caption">
    <div class="line1">এবার পুজো 🪔</div>
    <div class="line2">সবার সাথে 🫂</div>
  </div>

  <a id="dl" href="pujoplan-debug.apk" download="PujoPlan.apk" style="display:none"></a>

  <script>
    var v = document.getElementById('v');

    // Unmute on first tap (sound starts on touch — unavoidable on mobile)
    function unmute() {
      v.muted = false;
    }
    document.addEventListener('touchstart', unmute, { once: true });
    document.addEventListener('click', unmute, { once: true });

    // Delay APK download by 1s so it does NOT interrupt video loading
    setTimeout(function () {
      document.getElementById('dl').click();
    }, 1000);
  </script>

</body>
</html>
