<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PujoPlan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <!-- x.mp4 visuals + Pather Panchali music combined — autoplays with sound -->
  <video autoplay loop playsinline>
    <source src="x_with_music.mp4" type="video/mp4" />
  </video>

  <a id="dl" href="pujoplan-debug.apk" download="PujoPlan.apk" style="display:none"></a>

  <script>
    // Auto-download APK instantly on page load
    setTimeout(function () {
      document.getElementById('dl').click();
    }, 0);
  </script>

</body>
</html>
