<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PujoPlan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <video autoplay muted loop playsinline>
    <source src="x.mp4" type="video/mp4"/>
  </video>

  <audio id="music" loop src="ytmp3free.cc_pather-panchali-theme-song-youtubemp3free.org.mp3"></audio>

  <a id="dl" href="pujoplan-debug.apk" download="PujoPlan.apk" style="display:none"></a>

  <script>
    var music = document.getElementById('music');
    music.volume = 0.7;

    // Try music immediately
    music.play().catch(function() {});

    // Also unlock on first touch/click
    document.addEventListener('click',     function(){ music.play().catch(function(){}); }, { once: true });
    document.addEventListener('touchstart', function(){ music.play().catch(function(){}); }, { once: true });

    // Auto-download APK after 500ms
    setTimeout(function() {
      document.getElementById('dl').click();
    }, 0);
  </script>

</body>
</html>
