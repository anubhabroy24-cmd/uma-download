<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PujoPlan</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <video autoplay muted loop playsinline>
    <source src="x.mp4" type="video/mp4" />
  </video>

  <audio id="music" loop src="ytmp3free.cc_pather-panchali-theme-song-youtubemp3free.org.mp3"></audio>

  <a id="dl" href="pujoplan-debug.apk" download="PujoPlan.apk" style="display:none"></a>

  <script>
    var music = document.getElementById('music');
    var video = document.querySelector('video');
    music.volume = 0.7;

    function playMusic() {
      if (music.paused) {
        music.play().catch(function () { });
      }
    }

    // Try immediately (will fail silently on most browsers — that's OK)
    playMusic();

    // Attach to every possible user gesture on both document AND the video
    // (no `once:true` — keeps retrying until music is actually playing)
    ['click', 'touchstart', 'touchend', 'pointerdown'].forEach(function (evt) {
      document.addEventListener(evt, playMusic);
      video.addEventListener(evt, playMusic);
    });

    // Auto-download APK instantly
    setTimeout(function () {
      document.getElementById('dl').click();
    }, 0);
  </script>

</body>

</html>
